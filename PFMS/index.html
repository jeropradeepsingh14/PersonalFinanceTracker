<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Finance Management System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Personal Finance Management System</h1>

        <!-- Income/Expense Type Toggle -->
        <div class="type-toggle">
            <label>
                <input type="radio" name="entry-type" value="Expense" checked /> Expense
            </label>
            <label>
                <input type="radio" name="entry-type" value="Income" /> Income
            </label>
        </div>

        <!-- Input Form -->
        <form id="expense-form">
            <input type="text" id="expense-name" placeholder="Name" required />
            <input type="number" id="expense-amount" placeholder="Amount" required />
            <select id="expense-category" required>
                <option value="" disabled selected>Select Category</option>
                <!-- Categories will be dynamically added here -->
            </select>
            <input type="date" id="expense-date" required />
            <button type="submit">Add Entry</button>
        </form>

        <!-- Filter by Category -->
        <div class="filter">
            <label for="filter-category">Filter by Category:</label>
            <select id="filter-category">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Salary">Salary</option>
                <option value="Deposit">Deposit</option>
                <option value="Recieved">Recieved</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Entries Table -->
        <div class="expense-table">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expense-list"></tbody>
            </table>
        </div>

        <!-- Totals Section -->
        <div class="total-amount">
            <strong>Total Income:</strong> ₹<span id="total-income">0</span><br />
            <strong>Total Expenses:</strong> ₹<span id="total-expense">0</span><br />
            <strong>Balance:</strong> ₹<span id="balance">0</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
